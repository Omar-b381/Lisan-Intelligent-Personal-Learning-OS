[package]
name = "lisan"
version = "1.0.0"
description = "Lisan - Intelligent Desktop Spaced-Repetition Learning OS"
authors = ["Lisan Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "lisan_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-notification = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
sha2 = "0.10"
directories = "5.0"
csv = "1.3"
rand = "0.8"

[features]
# By default, we use standard tauri features
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
